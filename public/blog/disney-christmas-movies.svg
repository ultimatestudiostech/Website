<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A storybook castle on a snowy hill under a full moon, with pine trees and falling snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a44"/>
      <stop offset="0.6" stop-color="#0a1e33"/>
      <stop offset="1" stop-color="#071627"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf3d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fdf3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdff0"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33506e"/>
      <stop offset="1" stop-color="#1b3049"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="4"/><circle cx="300" cy="220" r="3"/><circle cx="470" cy="110" r="4"/>
    <circle cx="620" cy="200" r="3"/><circle cx="180" cy="330" r="3"/><circle cx="380" cy="330" r="4"/>
    <circle cx="1240" cy="130" r="4"/><circle cx="1420" cy="240" r="3"/><circle cx="1330" cy="360" r="4"/>
    <circle cx="1080" cy="90" r="3"/><circle cx="960" cy="180" r="3"/><circle cx="520" cy="270" r="3"/>
    <path d="M240 160 l4.5 10 10 4.5 -10 4.5 -4.5 10 -4.5 -10 -10 -4.5 10 -4.5 Z"/>
    <path d="M1360 160 l4.5 10 10 4.5 -10 4.5 -4.5 10 -4.5 -10 -10 -4.5 10 -4.5 Z"/>
    <path d="M1080 250 l3.6 8 8 3.6 -8 3.6 -3.6 8 -3.6 -8 -8 -3.6 8 -3.6 Z"/>
  </g>

  <!-- moon -->
  <circle cx="800" cy="238" r="150" fill="url(#moonGlow)"/>
  <circle cx="800" cy="238" r="86" fill="#fdf3d8"/>
  <circle cx="770" cy="215" r="13" fill="#eadfc0"/>
  <circle cx="828" cy="262" r="10" fill="#eadfc0"/>
  <circle cx="812" cy="205" r="7" fill="#eadfc0"/>

  <!-- distant pines -->
  <g fill="#0d2438">
    <path d="M60 640 l46 -110 46 110 Z"/><path d="M120 660 l40 -96 40 96 Z"/>
    <path d="M1390 650 l44 -104 44 104 Z"/><path d="M1450 630 l38 -92 38 92 Z"/>
    <path d="M240 668 l36 -84 36 84 Z"/><path d="M1290 672 l36 -84 36 84 Z"/>
  </g>

  <!-- snowy hill -->
  <path d="M0 690 Q 400 610 800 668 T 1600 660 V 900 H 0 Z" fill="url(#snow)"/>
  <path d="M0 760 Q 480 690 960 742 T 1600 736 V 900 H 0 Z" fill="#e6eef8"/>

  <!-- castle -->
  <g>
    <!-- side turrets -->
    <rect x="598" y="470" width="64" height="212" fill="url(#castle)"/>
    <path d="M592 470 L630 396 L668 470 Z" fill="#7a2436"/>
    <rect x="938" y="470" width="64" height="212" fill="url(#castle)"/>
    <path d="M932 470 L970 396 L1008 470 Z" fill="#7a2436"/>
    <!-- main keep -->
    <rect x="676" y="430" width="248" height="252" fill="url(#castle)"/>
    <path d="M664 430 H936 L916 396 H684 Z" fill="#243c57"/>
    <!-- central spire -->
    <rect x="756" y="300" width="88" height="110" fill="url(#castle)"/>
    <path d="M748 302 L800 196 L852 302 Z" fill="#8e2a3c"/>
    <rect x="796" y="150" width="8" height="52" fill="#d9c9a3"/>
    <path d="M800 108 l7.5 15.2 16.8 2.4 -12.1 11.9 2.8 16.7 -15 -7.9 -15 7.9 2.8 -16.7 -12.1 -11.9 16.8 -2.4 Z" fill="#f5b921"/>
    <!-- small turret roofs -->
    <path d="M676 430 l34 -44 34 44 Z" fill="#7a2436"/>
    <path d="M856 430 l34 -44 34 44 Z" fill="#7a2436"/>
    <!-- gate -->
    <path d="M762 682 v-64 a38 38 0 0 1 76 0 v64 Z" fill="#0a1826"/>
    <path d="M762 682 v-64 a38 38 0 0 1 76 0 v64" fill="none" stroke="#f5b921" stroke-width="4" opacity="0.7"/>
    <!-- lit windows -->
    <g fill="#ffca7a">
      <rect x="716" y="478" width="18" height="28" rx="9"/>
      <rect x="866" y="478" width="18" height="28" rx="9"/>
      <rect x="791" y="330" width="18" height="28" rx="9"/>
      <rect x="620" y="520" width="16" height="24" rx="8"/>
      <rect x="960" y="520" width="16" height="24" rx="8"/>
      <rect x="748" y="560" width="15" height="22" rx="7"/>
      <rect x="837" y="560" width="15" height="22" rx="7"/>
    </g>
    <!-- wreath on the gate -->
    <circle cx="800" cy="600" r="17" fill="none" stroke="#2e6b3e" stroke-width="8"/>
    <g fill="#c62f22">
      <circle cx="788" cy="590" r="4"/><circle cx="812" cy="590" r="4"/><circle cx="800" cy="612" r="4"/>
    </g>
    <path d="M800 578 l-10 -10 M800 578 l10 -10" stroke="#c62f22" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- foreground pines with snow -->
  <g>
    <g fill="#14401f">
      <path d="M300 560 l58 130 h-116 Z"/><path d="M300 610 l66 140 h-132 Z"/>
      <path d="M1300 560 l58 130 h-116 Z"/><path d="M1300 610 l66 140 h-132 Z"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <path d="M300 560 l20 44 h-40 Z"/><path d="M1300 560 l20 44 h-40 Z"/>
    </g>
    <rect x="292" y="742" width="16" height="34" fill="#4a3220"/>
    <rect x="1292" y="742" width="16" height="34" fill="#4a3220"/>
  </g>

  <!-- path of light from the gate -->
  <path d="M770 700 L830 700 L880 900 H720 Z" fill="#ffca7a" opacity="0.14"/>

  <!-- falling snow -->
  <g fill="#ffffff">
    <circle cx="180" cy="180" r="5" opacity="0.9"/><circle cx="420" cy="420" r="4" opacity="0.7"/>
    <circle cx="560" cy="150" r="5" opacity="0.8"/><circle cx="700" cy="480" r="4" opacity="0.6"/>
    <circle cx="920" cy="430" r="5" opacity="0.8"/><circle cx="1060" cy="200" r="4" opacity="0.7"/>
    <circle cx="1180" cy="470" r="5" opacity="0.75"/><circle cx="1480" cy="420" r="4" opacity="0.8"/>
    <circle cx="90" cy="520" r="4" opacity="0.7"/><circle cx="1520" cy="560" r="5" opacity="0.7"/>
    <circle cx="640" cy="600" r="4" opacity="0.55"/><circle cx="990" cy="590" r="4" opacity="0.55"/>
    <circle cx="350" cy="90" r="3" opacity="0.8"/><circle cx="1150" cy="90" r="3" opacity="0.8"/>
  </g>
</svg>
