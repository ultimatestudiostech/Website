  <rect x="0" y="0" width="1600" height="46" fill="#3d0d09"/>
  <rect x="0" y="46" width="1600" height="10" fill="#f5b921" opacity="0.55"/>

  <!-- string lights -->
  <path d="M120 60 Q 800 190 1480 60" fill="none" stroke="#0d0503" stroke-width="5"/>
  <g>
    <circle cx="300" cy="92" r="11" fill="#c62f22"/><circle cx="470" cy="118" r="11" fill="#f5b921"/>
    <circle cx="640" cy="132" r="11" fill="#2e9e57"/><circle cx="800" cy="138" r="11" fill="#fdf3d8"/>
    <circle cx="960" cy="132" r="11" fill="#c62f22"/><circle cx="1130" cy="118" r="11" fill="#f5b921"/>
    <circle cx="1300" cy="92" r="11" fill="#2e9e57"/>
    <circle cx="300" cy="92" r="22" fill="#c62f22" opacity="0.18"/><circle cx="640" cy="132" r="22" fill="#2e9e57" opacity="0.18"/>
    <circle cx="1130" cy="118" r="22" fill="#f5b921" opacity="0.18"/>
  </g>

  <!-- seats -->
  <g fill="#160a05">
    <rect x="330" y="712" width="130" height="88" rx="26"/>
    <rect x="500" y="712" width="130" height="88" rx="26"/>
    <rect x="670" y="712" width="130" height="88" rx="26"/>
    <rect x="840" y="712" width="130" height="88" rx="26"/>
    <rect x="1010" y="712" width="130" height="88" rx="26"/>
    <rect x="240" y="796" width="150" height="104" rx="30"/>
    <rect x="440" y="796" width="150" height="104" rx="30"/>
    <rect x="640" y="796" width="150" height="104" rx="30"/>
    <rect x="840" y="796" width="150" height="104" rx="30"/>
    <rect x="1040" y="796" width="150" height="104" rx="30"/>
    <rect x="1240" y="796" width="150" height="104" rx="30"/>
  </g>
  <g fill="#241108">
    <circle cx="395" cy="700" r="24"/><circle cx="565" cy="700" r="24"/><circle cx="905" cy="700" r="24"/><circle cx="1075" cy="700" r="24"/>
  </g>
</svg>
