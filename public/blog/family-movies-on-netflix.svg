<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A family on a sofa watching a glowing screen with a moon and stars, a bowl of popcorn beside them">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33200f"/>
      <stop offset="0.7" stop-color="#211207"/>
      <stop offset="1" stop-color="#150b04"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="0.65" stop-color="#0d2a40"/>
      <stop offset="1" stop-color="#0a1f30"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffca7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffca7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <ellipse cx="800" cy="360" rx="640" ry="330" fill="url(#screenGlow)"/>

  <!-- string lights -->
  <path d="M60 96 Q 800 210 1540 96" fill="none" stroke="#0d0503" stroke-width="5"/>
  <g>
    <circle cx="240" cy="126" r="10" fill="#f5b921"/><circle cx="430" cy="152" r="10" fill="#e2574c"/>
    <circle cx="620" cy="166" r="10" fill="#7fc46b"/><circle cx="800" cy="170" r="10" fill="#fdf3d8"/>
    <circle cx="980" cy="166" r="10" fill="#f5b921"/><circle cx="1170" cy="152" r="10" fill="#e2574c"/>
    <circle cx="1360" cy="126" r="10" fill="#7fc46b"/>
  </g>

  <!-- TV screen -->
  <rect x="400" y="170" width="800" height="450" rx="16" fill="#05080c"/>
  <rect x="416" y="186" width="768" height="418" rx="10" fill="url(#night)"/>
  <circle cx="1035" cy="290" r="52" fill="#fdf3d8"/>
  <path d="M1058 252 a52 52 0 1 0 24 66 a42 42 0 1 1 -24 -66 Z" fill="#e8d9ae" opacity="0.0"/>
  <g fill="#ffffff">
    <circle cx="500" cy="250" r="4"/><circle cx="580" cy="330" r="3"/><circle cx="660" cy="240" r="4"/>
    <circle cx="740" cy="310" r="3"/><circle cx="830" cy="230" r="4"/><circle cx="920" cy="350" r="3"/>
    <circle cx="1120" cy="380" r="4"/><circle cx="620" cy="420" r="3"/><circle cx="980" cy="440" r="3"/>
    <path d="M545 285 l4.5 10 10 4.5 -10 4.5 -4.5 10 -4.5 -10 -10 -4.5 10 -4.5 Z"/>
    <path d="M880 275 l3.6 8 8 3.6 -8 3.6 -3.6 8 -3.6 -8 -8 -3.6 8 -3.6 Z"/>
  </g>
  <path d="M416 500 Q 620 420 830 480 T 1184 470 V 604 H 416 Z" fill="#17456b"/>
  <path d="M416 545 Q 660 470 900 525 T 1184 520 V 604 H 416 Z" fill="#1e5a87"/>
  <!-- little rocket over the hills -->
  <g transform="rotate(24 700 380)">
    <ellipse cx="700" cy="380" rx="17" ry="34" fill="#e8eef2"/>
    <path d="M687 356 a17 20 0 0 1 26 0 Z" fill="#e2574c"/>
    <circle cx="700" cy="376" r="7" fill="#7fc8e8"/>
    <path d="M684 404 l-14 20 16 -4 Z" fill="#e2574c"/>
    <path d="M716 404 l14 20 -16 -4 Z" fill="#e2574c"/>
    <path d="M694 414 q6 18 12 0 l-3 26 h-6 Z" fill="#f5b921"/>
  </g>
  <rect x="772" y="620" width="56" height="26" fill="#05080c"/>

  <!-- lamp -->
  <ellipse cx="215" cy="430" rx="150" ry="150" fill="url(#lampGlow)"/>
  <path d="M215 640 V470" stroke="#0d0503" stroke-width="10"/>
  <path d="M168 470 L188 372 H242 L262 470 Z" fill="#f0a832"/>
  <path d="M140 640 H290" stroke="#0d0503" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="1395" cy="430" rx="150" ry="150" fill="url(#lampGlow)"/>
  <path d="M1395 640 V470" stroke="#0d0503" stroke-width="10"/>
  <path d="M1348 470 L1368 372 H1422 L1442 470 Z" fill="#f0a832"/>
  <path d="M1320 640 H1470" stroke="#0d0503" stroke-width="10" stroke-linecap="round"/>

  <!-- rug -->
  <ellipse cx="800" cy="856" rx="560" ry="52" fill="#40260f"/>
  <ellipse cx="800" cy="850" rx="470" ry="40" fill="#54331a"/>

  <!-- sofa -->
  <g fill="#101418">
    <rect x="470" y="646" width="660" height="120" rx="48"/>
    <rect x="430" y="700" width="740" height="130" rx="42"/>
    <rect x="408" y="676" width="86" height="140" rx="38"/>
    <rect x="1106" y="676" width="86" height="140" rx="38"/>
  </g>
  <g fill="#1b2530">
    <rect x="520" y="716" width="150" height="86" rx="24"/>
    <rect x="700" y="716" width="150" height="86" rx="24"/>
    <rect x="880" y="716" width="150" height="86" rx="24"/>
  </g>

  <!-- family silhouettes (backs of heads + shoulders) -->
  <g fill="#05070a">
    <circle cx="580" cy="668" r="40"/>
    <path d="M516 736 a64 52 0 0 1 128 0 Z"/>
    <circle cx="716" cy="682" r="31"/>
    <path d="M662 742 a54 44 0 0 1 108 0 Z"/>
    <circle cx="838" cy="682" r="31"/>
    <path d="M784 742 a54 44 0 0 1 108 0 Z"/>
    <circle cx="972" cy="668" r="40"/>
    <path d="M908 736 a64 52 0 0 1 128 0 Z"/>
  </g>
  <g fill="#2b1c0d" opacity="0.85">
    <path d="M540 640 a40 40 0 0 1 80 0 l0 10 a40 16 0 0 0 -80 0 Z"/>
    <path d="M932 640 a40 40 0 0 1 80 0 l0 10 a40 16 0 0 0 -80 0 Z"/>
  </g>

  <!-- popcorn bowl on the sofa -->
  <g>
    <path d="M748 726 h104 l-14 52 a10 10 0 0 1 -10 8 h-56 a10 10 0 0 1 -10 -8 Z" fill="#b3312a"/>
    <path d="M748 726 h104 l-3 12 H751 Z" fill="#e8eef2"/>
    <g fill="#fdf3d8">
      <circle cx="762" cy="722" r="11"/><circle cx="786" cy="714" r="12"/><circle cx="812" cy="714" r="12"/>
      <circle cx="836" cy="722" r="11"/><circle cx="800" cy="724" r="12"/>
    </g>
  </g>
</svg>
